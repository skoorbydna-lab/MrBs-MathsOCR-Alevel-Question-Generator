<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-Level Maths Past Exam Question Selector</title>
<style>
:root{color-scheme:dark;--bg:#14171a;--card:#1f2428;--ink:#e8e8e4;--mut:#9aa4aa;--acc:#6bb3e0;--line:#343c42;--e:#7bc47f;--m:#e0a040;--h:#f08a82;--cp:#6bb3e0;--cs:#f08a82;--cm:#7bc47f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,serif}
header{padding:18px 20px 0;border-bottom:1px solid var(--line);background:linear-gradient(#1b2025,var(--bg))}h1{margin:0 0 14px;font:400 26px/1.2 Georgia,serif;letter-spacing:.04em;color:var(--ink)}h1 .hl{color:var(--acc);font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{font:600 14px sans-serif;padding:8px 16px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:none;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);border-bottom:2px solid var(--card);margin-bottom:-1px}
.wrap{display:flex;flex-wrap:wrap;gap:16px;padding:16px;max-width:1300px;margin:auto}
aside{flex:1 1 250px;max-width:310px}main{flex:3 1 400px;min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.box h3{margin:0 0 8px;font:600 13px sans-serif;text-transform:uppercase;color:var(--mut)}
.chip{display:inline-block;margin:2px;padding:4px 9px;border:1.5px solid var(--line);border-radius:14px;font:13px sans-serif;cursor:pointer;background:none;color:var(--ink)}
.chip.cp{border-color:var(--cp);color:var(--cp)}.chip.cs{border-color:var(--cs);color:var(--cs)}.chip.cm{border-color:var(--cm);color:var(--cm)}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.chip.cp.on{background:var(--cp);color:var(--bg)}.chip.cs.on{background:var(--cs);color:var(--bg)}.chip.cm.on{background:var(--cm);color:var(--bg)}
.lg{font:12px sans-serif;margin-bottom:6px}.lg b{margin-right:10px}
select,input{font:14px sans-serif;padding:4px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px}
button.act{font:600 14px sans-serif;padding:8px 12px;border:0;border-radius:6px;background:var(--acc);color:var(--bg);cursor:pointer;margin:2px 0}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.q.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.meta{font:12px sans-serif;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.tag{padding:1px 7px;border-radius:10px;border:1px solid var(--line)}
.tag.cp{color:var(--cp);border-color:var(--cp)}.tag.cs{color:var(--cs);border-color:var(--cs)}.tag.cm{color:var(--cm);border-color:var(--cm)}
.d1{color:var(--e)}.d2{color:var(--m)}.d3{color:var(--h)}
.txt{white-space:pre-wrap}.qi{display:block;max-width:100%;height:auto;background:#fff;border-radius:4px}
.ans{display:none;margin-top:8px}.q.show .ans{display:block}
h3.ch{font:600 15px sans-serif;margin:18px 0 8px}h3.ch.cp{color:var(--cp)}h3.ch.cs{color:var(--cs)}h3.ch.cm{color:var(--cm)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#sheet{display:none}
body.ws>*:not(#sheet){display:none}body.ws #sheet{display:block;background:#fff;color:#000;padding:16px;min-height:100vh}
#sheet .pq{margin-bottom:18px;page-break-inside:avoid}@media print{.nop{display:none}#sheet{padding:0}}
</style></head><body>
<header><h1><span class="hl">A-Level Maths</span> Past Exam Question Selector</h1><div class="tabs" id="tabs"></div></header>
<div class="wrap">
<aside>
<div class="box"><h3>Textbook chapter</h3><div class="lg"><b style="color:var(--cp)">&#9632; Pure</b><b style="color:var(--cs)">&#9632; Statistics</b><b style="color:var(--cm)">&#9632; Mechanics</b></div><div id="topics"></div></div>
<div class="box"><h3>Difficulty</h3><div id="diffs"></div></div>
<div class="box"><h3>Paper &amp; marks</h3>
<select id="pp"></select><br><br>
Max marks <input id="maxm" type="number" min="1" value="20" style="width:60px"></div>
<div class="box"><h3>Worksheet (<span id="cnt">0</span> q, <span id="tm">0</span> marks)</h3>
<label><input type="checkbox" id="wans"> include mark schemes</label><br>
<button class="act" onclick="printSheet()">Open worksheet / print</button><div id="msg" style="font:13px sans-serif;color:var(--h)"></div>
<button class="act" style="background:var(--mut)" onclick="basket=[];save();render()">Clear selection</button></div>
</aside>
<main><div id="list"></div></main></div>
<div id="sheet"></div>
<script src="data.js"></script>
<script>
const fp=k=>k.replace(/\//g,'_');
const LV=['Y12 Maths','Y13 Maths','Y12 FM','Y13 FM'];
const LVC={'Y12 Maths':'H230','Y13 Maths':'H240','Y12 FM':'H245','Y13 FM':'H245'};
const D=RAW.map(r=>({pre:r[7]||LVC[r[0]],k:(r[7]||LVC[r[0]])+'/'+r[1]+'-'+r[2]+'/'+r[3],lvl:r[0],y:r[1],p:r[2],q:r[3],m:r[4],d:r[5],t:r[6]}));
const lab=q=>`June 20${q.y} ${q.pre}/0${q.p} Q${q.q}`;
const img=(q,e)=>`<img class="qi" ${e?'':'loading="lazy" '}src="img/q/${fp(q.k)}.jpg" alt="${lab(q)}">`;
const am=(q,e)=>`<img class="qi" style="border:1px solid #ccc" ${e?'':'loading="lazy" '}src="img/a/${fp(q.k)}.jpg" alt="Mark scheme ${lab(q)}">`;
let S={};try{S=JSON.parse(localStorage.getItem('qb2')||'{}')}catch(e){}
let basket=S.b||[],dOv=S.d||{},lv=S.l||LV[0],fT=new Set(),fD=new Set(),lastC=0;
const pt=t=>t.split('.').map(Number),BN={12:'Y12',13:'Y13',21:'Y12 FM',22:'Y13 FM'},bk=()=>({'Y12 Maths':12,'Y13 Maths':13,'Y12 FM':21,'Y13 FM':22}[lv]);
const cat=t=>{const[b,c]=pt(t);if(b==31)return'm';if(b==32)return's';return c<=15?'p':c<=18?'s':'m'};
const TB={'Y12 Maths':[12],'Y13 Maths':[13,12],'Y12 FM':[21,32,31],'Y13 FM':[22,21,32,31]},BS={12:'Y12',13:'Y13',21:'Pure 1',22:'Pure 2',31:'Mechanics',32:'Statistics'},BH={12:'Year 12 content',13:'Year 13 content',21:'Core Pure 1',22:'Core Pure 2',31:'Mechanics',32:'Statistics',prov:'Statistics (chapters to be added)'};
const g=t=>(pt(t)[0]==21&&pt(t)[1]>=16)?'prov':pt(t)[0];
const ord=t=>{const[b,c]=pt(t);const i=TB[lv].indexOf(b);return(i<0?9:i)*100+c};
const prov=t=>{const[b,c]=pt(t);return b==21&&c>=16};
const cname=t=>{const[b,c]=pt(t);return CHB[b][c]};
const clab=t=>{const[b,c]=pt(t);if(prov(t))return CHB[b][c];return(b==TB[lv][0]?'':BS[b]+' ')+'Ch '+c+': '+CHB[b][c]};
const dn=['','Easy','Medium','Hard'],gd=q=>dOv[q.k]||q.d;
function save(){try{localStorage.setItem('qb2',JSON.stringify({b:basket,d:dOv,l:lv}))}catch(e){}}
const cur=()=>D.filter(q=>q.lvl==lv);
function build(){
 tabs.innerHTML=LV.map(l=>`<button class="${l==lv?'on':''}" data-l="${l}">${l} (${D.filter(q=>q.lvl==l).length})</button>`).join('');
 const Q=cur(),tl=[...new Set(Q.flatMap(q=>q.t))].sort((a,b)=>ord(a)-ord(b));let lg='';const mg=new Set(tl.map(g)).size>1;
 topics.innerHTML=tl.map(t=>{let h='';if(mg&&g(t)!==lg){lg=g(t);h='<div style="font:12px sans-serif;color:var(--mut);margin:8px 0 2px">'+BH[g(t)]+'</div>'}
  return h+`<button class="chip c${cat(t)}${fT.has(t)?' on':''}" data-t="${t}">${prov(t)?'':pt(t)[1]+'. '}${cname(t)} (${Q.filter(q=>q.t.includes(t)).length})</button>`}).join('')||'<i style="font:13px sans-serif">No chapters yet</i>';
 diffs.innerHTML=[1,2,3].map(n=>`<button class="chip${fD.has(n)?' on':''}" data-d="${n}">${dn[n]}</button>`).join('');
 const ps=[...new Set(Q.map(q=>lab(q).replace(/ Q\d+$/,'')))];
 pp.innerHTML='<option value="">All papers</option>'+ps.map(p=>`<option>${p}</option>`).join('')}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){lv=l.dataset.l;fT.clear();fD.clear();save();build();render();return}
 const c=e.target.closest('.chip');if(!c)return;
 if(c.dataset.t){const k=c.dataset.t;fT.has(k)?fT.delete(k):fT.add(k)}else{const k=+c.dataset.d;fD.has(k)?fD.delete(k):fD.add(k)}
 c.classList.toggle('on');render()});
pp.onchange=maxm.oninput=()=>render();
function tog(k){const i=basket.indexOf(k);i<0?basket.push(k):basket.splice(i,1);save();render()}
function ans(i){document.getElementById('q'+i).classList.toggle('show')}
function setD(k,v){dOv[k]=+v;save();render()}
function hd(q){const t=bt(q);if(t===lastC)return'';lastC=t;return`<h3 class="ch c${cat(t)}">${pt(t)[0]!=TB[lv][0]?BH[pt(t)[0]]+' · ':''}${prov(t)?'':'Chapter '+pt(t)[1]+': '}${cname(t)}</h3>`}
const bt=q=>q.t.slice().sort((a,b)=>ord(a)-ord(b))[0];
function render(){
 const mx=+maxm.value||999;lastC='';
 const L=cur().filter(q=>(!fT.size||q.t.some(t=>fT.has(t)))&&(!fD.size||fD.has(gd(q)))&&(!pp.value||lab(q).startsWith(pp.value))&&q.m<=mx)
  .sort((a,b)=>ord(bt(a))-ord(bt(b))||a.y-b.y||a.p-b.p||a.q-b.q);
 list.innerHTML=L.length?L.map((q,n)=>hd(q)+`<div class="q${basket.includes(q.k)?' sel':''}" id="q${n}">
 <div class="meta"><b>${lab(q)}</b><span>${q.m} marks</span><span class="d${gd(q)}">${dn[gd(q)]}</span>
 ${q.t.map(t=>`<span class="tag c${cat(t)}">${clab(t)}</span>`).join('')}</div>
 ${img(q)}<div class="ans">${am(q)}</div>
 <div class="row"><button class="act" onclick="tog('${q.k}')">${basket.includes(q.k)?'Remove':'Add to worksheet'}</button>
 <button class="act" style="background:var(--mut)" onclick="ans(${n})">Mark scheme</button>
 <select onchange="setD('${q.k}',this.value)" title="Edit difficulty">${[1,2,3].map(v=>`<option value="${v}"${v==gd(q)?' selected':''}>${dn[v]}</option>`).join('')}</select></div></div>`).join(''):'<p>No questions here yet. Send the papers (and the textbook contents page for this course) and I will add them.</p>';
 cnt.textContent=basket.length;tm.textContent=basket.reduce((s,k)=>s+D.find(q=>q.k==k).m,0)}
function body_(){const B=basket.map(k=>D.find(q=>q.k==k));
 return '<h2 style="font-family:sans-serif">Maths worksheet</h2>'+B.map((q,n)=>`<div class="pq"><div style="font:11px sans-serif;color:#555">Worksheet Q${n+1} · ${lab(q)} · ${q.m} marks</div>${img(q,1)}</div>`).join('')
 +(wans.checked?'<h2 style="page-break-before:always;font-family:sans-serif">Mark schemes</h2>'+B.map((q,n)=>`<div class="pq"><div style="font:11px sans-serif;color:#555">Worksheet Q${n+1} · ${lab(q)}</div>${am(q,1)}</div>`).join(''):'')}
function printSheet(){
 if(!basket.length){msg.textContent='Add some questions to the worksheet first.';return}
 msg.textContent='';
 sheet.innerHTML='<div class="nop"><button class="act" onclick="closeSheet()">&larr; Back</button> <button class="act" onclick="try{window.print()}catch(e){}">Print / save as PDF</button> <button class="act" onclick="dl()">Download as HTML file</button><p style="font:13px sans-serif;color:#555">If Print does nothing here, use Download, open the downloaded file in your browser on this computer, then print (Ctrl/Cmd+P) and choose Save as PDF.</p></div>'+body_();
 document.body.classList.add('ws');window.scrollTo(0,0)}
function closeSheet(){document.body.classList.remove('ws')}
function dl(){const base=location.href.replace(/[^/]*$/,'');const h='<!DOCTYPE html><meta charset="utf-8"><base href="'+base+'"><title>Maths worksheet</title><style>body{font:15px Georgia,serif;margin:20px}.pq{margin-bottom:18px;page-break-inside:avoid}img{max-width:100%}</style>'+body_();
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='worksheet.html';document.body.appendChild(a);a.click();a.remove()}
build();render();
</script></body></html>
