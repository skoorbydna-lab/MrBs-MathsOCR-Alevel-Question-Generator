<!DOCTYPE html><html><head><meta charset="utf-8"><title>Set password</title><script src="sha.js"></script>
<style>body{font:15px sans-serif;max-width:640px;margin:40px auto;padding:0 16px;background:#14171a;color:#e8e8e4}input,textarea{width:100%;padding:8px;font:14px monospace;background:#1f2428;color:#e8e8e4;border:1px solid #343c42;border-radius:4px}button{padding:8px 14px;margin:10px 0;border:0;border-radius:6px;background:#6bb3e0;color:#14171a;font-weight:600;cursor:pointer}</style></head><body>
<h2>Set a new password</h2><p>Type the password you want, click the button, then copy the result into <b>auth.js</b> (replace everything in that file) and upload it with the rest of the site. The password itself is never stored, only a scrambled version.</p>
<input id="p" type="text" placeholder="New password"><br><button onclick="mk()">Make auth.js</button><textarea id="o" rows="4" readonly></textarea>
<script>function mk(){var p=document.getElementById('p').value;if(p.length<8){alert('Use at least 8 characters.');return}var a=new Uint8Array(8),s='';(window.crypto||{getRandomValues:function(x){for(var i=0;i<x.length;i++)x[i]=Math.random()*256}}).getRandomValues(a);for(var i=0;i<8;i++)s+=('0'+a[i].toString(16)).slice(-2);var r=5000;document.getElementById('o').value='const AUTH={salt:"'+s+'",rounds:'+r+',hash:"'+hashPw(p,s,r)+'"};'}</script></body></html>
